<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>友链 | 部可思亿</title>
<link rel="icon" href="https://j47v.top/favicon.ico">
<link rel="stylesheet" href="../css/index.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.card-style{padding:1.5rem;margin-bottom:1.5rem;background:var(--card-bg);border-radius:12px;border:1px solid #eee}
.link-item{padding:12px 0;border-bottom:1px solid #eee}
.link-name{font-weight:600;margin-bottom:5px;color:var(--text-color)}
.link-desc{font-size:0.9rem;color:#666;margin-bottom:5px}
.form-input{margin-bottom:12px}
.form-input input,.form-input textarea{width:100%;padding:10px;border:2px solid #0096c8;border-radius:6px;background:#fff}
.dark .form-input input,.dark .form-input textarea{background:#2a2a2a;color:#e0e0e0;border-color:#0096c8}
.yl-btn{padding:10px 20px;background:linear-gradient(90deg,#0096c8,#00d4aa);color:white;border-radius:6px;font-weight:600;border:none;cursor:pointer;font-size:1rem}
.back-btn{display:inline-block;margin-top:30px;color:#0096c8;text-decoration:none;font-weight:500}
.section-title{margin-bottom:15px;color:var(--text-color);font-size:1.3rem}
</style>
</head>
<body>
<div class="loader">
<div class="spinner">
<div class="dot1"></div>
<div class="dot2"></div>
<div class="dot3"></div>
</div>
</div>
<button class="theme-toggle" title="切换主题">
<i class="fas fa-palette"></i>
</button>

<div class="main-container">

<div class="card-style">
<div class="section-title">申请规则</div>
<div style="color:var(--text-color)">
<div><i class="fas fa-check" style="color:#0096c8"></i> 网站内容健康，无违法信息</div>
<div><i class="fas fa-check" style="color:#0096c8"></i> 网站稳定运行3个月以上</div>
<div><i class="fas fa-check" style="color:#0096c8"></i> 需添加本站链接</div>
<div><i class="fas fa-check" style="color:#0096c8"></i> 审核周期：1-3个工作日</div>
</div>
</div>

<div class="card-style">
<div class="section-title">友链列表</div>
<div id="linksContainer">
<div style="text-align:center;padding:2rem"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
</div>
</div>

<div class="card-style">
<div class="section-title">申请友链</div>
<div class="form-input"><input type="text" id="siteName" placeholder="网站名称" required></div>
<div class="form-input"><input type="url" id="siteUrl" placeholder="网站地址" required></div>
<div class="form-input"><textarea id="siteDesc" placeholder="网站描述" rows="2"></textarea></div>
<div class="form-input"><input type="email" id="siteEmail" placeholder="联系邮箱"></div>
<button class="yl-btn" onclick="submitLink()">提交申请</button>
</div>

<a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a>
</div>
<script src="../js/index.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
setTimeout(()=>{
document.querySelector('.loader').classList.add('hidden');
setTimeout(()=>{document.querySelector('.loader').style.display='none'},500);
},1000);
loadLinks();
});

async function loadLinks(){
try{
const response=await fetch('/.netlify/functions/yl');
if(!response.ok)throw new Error('网络错误');
const result=await response.json();
if(result.success){
let html='';
result.data.forEach(link=>{
html+=`<div class="link-item">
<div class="link-name">${link.name}</div>
<div class="link-desc">${link.description||''}</div>
<a href="${link.url}" target="_blank" style="font-size:0.8rem;color:#0096c8">
${link.url.replace('https://','').replace('http://','')}
</a>
</div>`;
});
document.getElementById('linksContainer').innerHTML=html||'<div style="text-align:center;padding:1rem">暂无友链</div>';
}else{
throw new Error(result.error);
}
}catch(error){
document.getElementById('linksContainer').innerHTML='<div style="text-align:center;padding:1rem;color:#dc3545">加载失败</div>';
}
}

async function submitLink(){
const name=document.getElementById('siteName').value.trim();
const url=document.getElementById('siteUrl').value.trim();
if(!name||!url){
alert('请填写网站名称和地址');
return;
}
try{
const response=await fetch('/.netlify/functions/yl',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name,
url,
description:document.getElementById('siteDesc').value.trim(),
email:document.getElementById('siteEmail').value.trim()
})
});
const result=await response.json();
if(result.success){
alert('提交成功！等待审核');
document.getElementById('siteName').value='';
document.getElementById('siteUrl').value='';
document.getElementById('siteDesc').value='';
document.getElementById('siteEmail').value='';
loadLinks();
}else{
alert('提交失败：'+result.error);
}
}catch(error){
alert('网络错误，请稍后重试');
}
}
</script>
</body>
</html>
