<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>音乐 | 部可思亿</title><link rel="icon" href="https://j47v.top/favicon.ico" type="image/x-icon"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#fff;color:#333;line-height:1.5}.container{max-width:800px;margin:0 auto;padding:15px}.navbar{background:#fff;padding:15px 0;margin-bottom:15px;border-bottom:2px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.navbar h1{font-size:1.5rem;font-weight:600;background:linear-gradient(135deg,#0066ff,#00cc99);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}.refresh-btn{background:linear-gradient(135deg,#0066ff,#00cc99);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:.85rem;transition:all .2s}.refresh-btn:hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(0,102,255,0.2)}.nav-tabs{display:flex;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:10px}.tab-btn{flex:1;padding:12px;text-align:center;cursor:pointer;background:none;border:none;color:#666;font-size:.9rem;transition:all .2s;border-bottom:2px solid transparent}.tab-btn:hover{background:#f8f9fa}.tab-btn.active{color:#0066ff;border-bottom-color:#0066ff;font-weight:500}.song-list{padding:0}.song-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid #f0f0f0;transition:background .2s;cursor:pointer}.song-item:hover{background:#fafafa}.song-item.playing{background:rgba(0,102,255,0.05);border-left:2px solid #0066ff}.album-cover{width:40px;height:40px;border-radius:4px;overflow:hidden;margin-right:10px;background:#f5f5f5}.album-cover img{width:100%;height:100%;object-fit:cover}.song-info{flex:1;min-width:0}.song-title{font-weight:500;margin-bottom:2px;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-artist{font-size:.8rem;color:#666;margin-bottom:1px}.song-album{font-size:.75rem;color:#999}.play-btn{background:linear-gradient(135deg,#0066ff,#00cc99);color:#fff;border:none;padding:4px 8px;border-radius:2px;cursor:pointer;font-size:.8rem;transition:all .2s;margin-left:8px}.play-btn:hover{transform:translateY(-1px)}.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;display:none}.loading-spinner{width:40px;height:40px;border:3px solid #f0f0f0;border-top:3px solid #0066ff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.loading-text{margin-top:12px;color:#666;font-size:.9rem}.search-box{padding:10px 0}.search-input{width:100%;padding:8px 10px;border:1px solid #e0e0e0;border-radius:4px;font-size:.9rem;transition:all .2s}.search-input:focus{border-color:#0066ff;outline:none;box-shadow:0 0 0 2px rgba(0,102,255,0.1)}.player-window{position:fixed;bottom:20px;right:-350px;width:300px;background:#fff;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.15);z-index:1000;overflow:hidden;border:1px solid #e0e0e0;transition:right .4s}.player-window.active{right:20px}.player-header{background:linear-gradient(135deg,#0066ff,#00cc99);padding:15px;color:#fff}.player-title{font-weight:600;font-size:1rem;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-artist{font-size:.85rem;opacity:.95}.player-content{padding:15px}.audio-progress{margin:15px 0;padding:8px 0}.progress-bar{width:100%;height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;cursor:pointer}.progress-fill{height:100%;background:linear-gradient(90deg,#0066ff,#00cc99);width:0;transition:width .3s}.progress-time{display:flex;justify-content:space-between;margin-top:5px;font-size:.75rem;color:#999}.player-controls{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:10px}.control-btn{width:45px;height:45px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s}.play-pause-btn{background:linear-gradient(135deg,#0066ff,#00cc99);color:#fff;box-shadow:0 4px 8px rgba(0,102,255,0.2)}.play-pause-btn:hover{transform:scale(1.05)}.close-btn-circle{background:linear-gradient(135deg,#666,#999);color:#fff;box-shadow:0 4px 8px rgba(0,0,0,0.1)}.close-btn-circle:hover{transform:scale(1.05)}.player-loading{text-align:center;padding:15px;color:#999;font-size:.85rem;display:none}.no-results{padding:40px 15px;text-align:center;color:#999;font-size:.9rem}.song-duration{font-size:.75rem;color:#999;margin-left:8px;min-width:40px}.song-index{width:25px;text-align:center;color:#999;font-size:.85rem;margin-right:5px}.open-player-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:linear-gradient(135deg,#0066ff,#00cc99);color:#fff;border-radius:50%;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,102,255,0.2);display:none;align-items:center;justify-content:center;font-size:1.2rem;z-index:99;transition:all .3s}.open-player-btn:hover{transform:scale(1.05)}.open-player-btn.active{display:flex}</style></head><body><div class="container"><div class="navbar"><h1>思亿音乐</h1><button class="refresh-btn" id="refresh-btn" onclick="refreshDiscover()">刷新</button></div><div class="nav-tabs"><button class="tab-btn active" onclick="switchTab('discover')">发现</button><button class="tab-btn" onclick="switchTab('search')">搜索</button></div><div class="content-area"><div id="discover" class="tab-content"><div class="song-list" id="discover-songs"><div class="no-results">加载推荐音乐...</div></div></div><div id="search" class="tab-content" style="display:none"><div class="search-box"><input type="text" class="search-input" id="search-input" placeholder="搜索歌曲、歌手..." onkeypress="if(event.key==='Enter')searchSongs()"></div><div class="song-list" id="search-results"><div class="no-results">输入关键词搜索音乐</div></div></div></div></div><div class="loading-overlay" id="loading"><div class="loading-spinner"></div><div class="loading-text">加载中...</div></div><div class="player-window" id="player-window"><div class="player-header"><div class="player-title" id="current-title">未选择歌曲</div><div class="player-artist" id="current-artist">点击播放按钮开始聆听</div></div><div class="player-content"><div class="player-loading" id="player-loading">正在加载音频...</div><div class="audio-progress" id="audio-progress" style="display:none"><div class="progress-bar" onclick="seekAudio(event)"><div class="progress-fill" id="progress-fill"></div></div><div class="progress-time"><span id="current-time">00:00</span><span id="total-time">00:00</span></div></div><div class="player-controls"><button class="control-btn play-pause-btn" id="play-pause-btn" onclick="togglePlayPause()">▶</button><button class="control-btn close-btn-circle" onclick="closePlayer()">×</button></div></div><audio id="audio-player" onended="onSongEnded()" ontimeupdate="updateProgress()" oncanplay="onAudioCanPlay()" onerror="onAudioError()" onloadedmetadata="onAudioLoaded()"></audio></div><button class="open-player-btn" id="open-player" onclick="openPlayer()">♪</button><script>let currentAudio=null,currentSongData=null,loadingTimeout=null,isPlaying=false,currentPlayingItem=null,usedDiscoverSongs=new Set,usedDiscoverArtists=new Set;const discoverArtists=[{name:"周杰伦",region:"中国"},{name:"Taylor Swift",region:"美国"},{name:"BTS",region:"韩国"},{name:"Ed Sheeran",region:"英国"},{name:"林俊杰",region:"中国"},{name:"Billie Eilish",region:"美国"},{name:"BLACKPINK",region:"韩国"},{name:"Adele",region:"英国"},{name:"邓紫棋",region:"中国"},{name:"Post Malone",region:"美国"},{name:"IU",region:"韩国"},{name:"Coldplay",region:"英国"}];function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>{c.style.display='none'});document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');document.getElementById(tab).style.display='block';if(tab==='discover'){document.getElementById('refresh-btn').style.display='block';if(!document.querySelector('#discover-songs .song-item'))loadDiscover();}else{document.getElementById('refresh-btn').style.display='none';}}function showLoading(){clearTimeout(loadingTimeout);document.getElementById('loading').style.display='flex';loadingTimeout=setTimeout(()=>{hideLoading()},4000)}function hideLoading(){clearTimeout(loadingTimeout);document.getElementById('loading').style.display='none'}async function loadDiscover(){showLoading();try{let availableArtists=discoverArtists.filter(a=>!usedDiscoverArtists.has(a.name));if(availableArtists.length<4){usedDiscoverSongs.clear();usedDiscoverArtists.clear();}let allSongs=[];for(let i=0;i<4;i++){if(availableArtists.length===0)break;let randomIndex=Math.floor(Math.random()*availableArtists.length);let artistInfo=availableArtists[randomIndex];availableArtists.splice(randomIndex,1);try{let response=await fetch(`https://api.mmp.cc/api/kuwo?action=search_song&msg=${encodeURIComponent(artistInfo.name)}&pageSize=3`);let text=await response.text();let data;try{data=JSON.parse(text);}catch(e){continue;}let songs=[];if(Array.isArray(data)){songs=data;}else if(data.code===200&&data.play_url){songs=[data];}else if(data.data&&Array.isArray(data.data)){songs=data.data;}if(songs.length>0){let firstSong=songs[0];if(firstSong.name&&firstSong.artist&&!usedDiscoverSongs.has(firstSong.name)&&!usedDiscoverArtists.has(firstSong.artist)){allSongs.push(firstSong);usedDiscoverSongs.add(firstSong.name);usedDiscoverArtists.add(firstSong.artist);}}}catch(error){console.error(`加载${artistInfo.name}失败:`,error);}}if(allSongs.length===0){allSongs=[{name:"七里香",artist:"周杰伦",album:"七里香",duration:"04:59",play_url:"http://example.com/1.mp3"},{name:"Shake It Off",artist:"Taylor Swift",album:"1989",duration:"03:39",play_url:"http://example.com/2.mp3"},{name:"Dynamite",artist:"BTS",album:"BE",duration:"03:19",play_url:"http://example.com/3.mp3"},{name:"Perfect",artist:"Ed Sheeran",album:"÷",duration:"04:23",play_url:"http://example.com/4.mp3"}];}renderSongs('discover-songs',allSongs.slice(0,4));}catch(error){console.error('发现加载失败:',error);renderSongs('discover-songs',[{name:"七里香",artist:"周杰伦",album:"七里香",duration:"04:59"},{name:"Shake It Off",artist:"Taylor Swift",album:"1989",duration:"03:39"},{name:"Dynamite",artist:"BTS",album:"BE",duration:"03:19"},{name:"Perfect",artist:"Ed Sheeran",album:"÷",duration:"04:23"}]);}hideLoading();}async function refreshDiscover(){showLoading();try{let availableArtists=discoverArtists.filter(a=>!usedDiscoverArtists.has(a.name));if(availableArtists.length<4){usedDiscoverSongs.clear();usedDiscoverArtists.clear();let resetArtists=discoverArtists.slice();for(let i=0;i<4;i++){if(resetArtists.length===0)break;let randomIndex=Math.floor(Math.random()*resetArtists.length);let artistInfo=resetArtists[randomIndex];resetArtists.splice(randomIndex,1);try{let response=await fetch(`https://api.mmp.cc/api/kuwo?action=search_song&msg=${encodeURIComponent(artistInfo.name)}&pageSize=3`);let text=await response.text();let data;try{data=JSON.parse(text);}catch(e){continue;}let songs=[];if(Array.isArray(data)){songs=data;}else if(data.code===200&&data.play_url){songs=[data];}else if(data.data&&Array.isArray(data.data)){songs=data.data;}if(songs.length>0){let firstSong=songs[0];if(firstSong.name&&firstSong.artist){usedDiscoverSongs.add(firstSong.name);usedDiscoverArtists.add(firstSong.artist);}}}catch(error){console.error(`加载${artistInfo.name}失败:`,error);}}}await loadDiscover();}catch(error){console.error('刷新失败:',error);hideLoading();}}function renderSongs(containerId,songs){let container=document.getElementById(containerId);if(!container)return;if(!songs||songs.length===0){container.innerHTML='<div class="no-results">暂无歌曲</div>';return;}let html='';songs.forEach((song,index)=>{let songName=song.name||song.song_name||'未知歌曲';let artist=song.artist||song.singer||'未知歌手';let album=song.album||'未知专辑';let duration=song.duration||'--:--';let cover=song.cover||song.pic||`https://picsum.photos/40/40?random=${index}&blur=1&grayscale`;let playUrl=song.play_url||'';html+=`<div class="song-item" data-song='${JSON.stringify(song).replace(/'/g,"&apos;")}' onclick="playThisSong(event)"><div class="song-index">${index+1}</div><div class="album-cover"><img src="${cover}" alt="${songName}" onerror="this.onerror=null;this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0iI2Y1ZjVmNSI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIi8+PHBhdGggZD0iTTIwIDM0YzcuNzIgMCAxNC02LjI4IDE0LTE0cy02LjI4LTE0LTE0LTE0LTE0IDYuMjgtMTQgMTQgNi4yOCAxNCAxNCAxNHptMC0yNGM1LjUyIDAgMTAgNC40OCAxMCAxMHMtNC40OCAxMC0xMCAxMC0xMC00LjQ4LTEwLTEwIDQuNDgtMTAgMTAtMTB6IiBmaWxsPSIjY2MiLz48L3N2Zz4='"></div><div class="song-info"><div class="song-title">${songName}</div><div class="song-artist">${artist}</div><div class="song-album">${album}</div></div><div class="song-duration">${duration}</div><button class="play-btn" onclick="event.stopPropagation();playThisSong(event)">播放</button></div>`;});container.innerHTML=html;}async function playThisSong(event){closePlayer();document.getElementById('open-player').classList.remove('active');if(currentPlayingItem){currentPlayingItem.classList.remove('playing');}let item=event.currentTarget.closest('.song-item');if(!item)return;item.classList.add('playing');currentPlayingItem=item;try{let songData;try{songData=JSON.parse(item.getAttribute('data-song').replace(/&apos;/g,"'"));}catch(e){return;}let songName=songData.name||songData.song_name;let artist=songData.artist||songData.singer;document.getElementById('current-title').textContent=songName;document.getElementById('current-artist').textContent=artist||'未知歌手';document.getElementById('player-loading').style.display='block';document.getElementById('audio-progress').style.display='none';document.getElementById('play-pause-btn').textContent='▶';currentSongData=songData;let playUrl=songData.play_url;if(playUrl){let audioPlayer=document.getElementById('audio-player');audioPlayer.src=playUrl;audioPlayer.load();}else{console.error('无播放链接');document.getElementById('player-loading').textContent='无法播放';setTimeout(()=>{document.getElementById('player-loading').style.display='none';document.getElementById('open-player').classList.add('active');},2000);}}catch(error){console.error('播放失败:',error);document.getElementById('player-loading').textContent='加载失败';setTimeout(()=>{document.getElementById('player-loading').style.display='none';document.getElementById('open-player').classList.add('active');},2000);}}function onAudioCanPlay(){document.getElementById('player-loading').style.display='none';document.getElementById('audio-progress').style.display='block';document.getElementById('player-window').classList.add('active');let audioPlayer=document.getElementById('audio-player');audioPlayer.play().then(()=>{isPlaying=true;document.getElementById('play-pause-btn').textContent='Ⅱ';}).catch(error=>{console.error('播放失败:',error);document.getElementById('play-pause-btn').textContent='▶';});}function onAudioLoaded(){let audioPlayer=document.getElementById('audio-player');if(audioPlayer.duration){let minutes=Math.floor(audioPlayer.duration/60);let seconds=Math.floor(audioPlayer.duration%60);document.getElementById('total-time').textContent=`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;}}function onAudioError(){console.error('音频加载错误');document.getElementById('player-loading').textContent='音频加载失败';setTimeout(()=>{document.getElementById('player-loading').style.display='none';document.getElementById('open-player').classList.add('active');},2000);}function togglePlayPause(){let audioPlayer=document.getElementById('audio-player');if(isPlaying){audioPlayer.pause();document.getElementById('play-pause-btn').textContent='▶';isPlaying=false;}else{audioPlayer.play().then(()=>{document.getElementById('play-pause-btn').textContent='Ⅱ';isPlaying=true;}).catch(error=>{console.error('播放失败:',error);});}}function closePlayer(){document.getElementById('player-window').classList.remove('active');let audioPlayer=document.getElementById('audio-player');audioPlayer.pause();isPlaying=false;document.getElementById('play-pause-btn').textContent='▶';}function openPlayer(){if(currentSongData){document.getElementById('player-window').classList.add('active');document.getElementById('open-player').classList.remove('active');}}function onSongEnded(){isPlaying=false;document.getElementById('play-pause-btn').textContent='▶';if(currentPlayingItem){currentPlayingItem.classList.remove('playing');currentPlayingItem=null;}}function updateProgress(){let audioPlayer=document.getElementById('audio-player');if(audioPlayer.duration>0){let progress=(audioPlayer.currentTime/audioPlayer.duration)*100;document.getElementById('progress-fill').style.width=progress+'%';let currentMinutes=Math.floor(audioPlayer.currentTime/60);let currentSeconds=Math.floor(audioPlayer.currentTime%60);document.getElementById('current-time').textContent=`${currentMinutes.toString().padStart(2,'0')}:${currentSeconds.toString().padStart(2,'0')}`;}}function seekAudio(event){let audioPlayer=document.getElementById('audio-player');if(audioPlayer.duration>0){let progressBar=event.currentTarget;let clickPosition=event.offsetX;let progressBarWidth=progressBar.offsetWidth;let seekTime=(clickPosition/progressBarWidth)*audioPlayer.duration;audioPlayer.currentTime=seekTime;}}async function searchSongs(){let query=document.getElementById('search-input').value.trim();if(!query)return;showLoading();try{let response=await fetch(`https://api.mmp.cc/api/kuwo?action=search_song&msg=${encodeURIComponent(query)}&pageSize=10`);let text=await response.text();let data;try{data=JSON.parse(text);}catch(e){renderSongs('search-results',[]);hideLoading();return;}let songs=[];if(Array.isArray(data)){songs=data.slice(0,10);}else if(data.code===200&&data.play_url){songs=[data];}else if(data.data&&Array.isArray(data.data)){songs=data.data.slice(0,10);}if(songs.length===0){renderSongs('search-results',[]);}else{renderSongs('search-results',songs);}}catch(error){console.error('搜索失败:',error);renderSongs('search-results',[]);}hideLoading();}window.onload=function(){loadDiscover();}</script></body></html>
