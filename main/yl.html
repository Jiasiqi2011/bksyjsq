<script>
const siteData=[
    {keywords:['二维码','生成','QR','code'],title:'二维码生成工具',desc:'快速生成定制二维码，支持文字、链接、图片等多种格式',link:'https://api.bksy.top/main/wed/tool/2wm'},
    {keywords:['图片','压缩','optimize','photo'],title:'图片压缩工具',desc:'优化图片大小与质量，支持JPG、PNG、WebP格式',link:'https://api.bksy.top/main/wed/tool/piccom'},
    {keywords:['音乐','歌曲','播放','listen'],title:'阿波罗音乐播放器',desc:'免费全网音乐播放器，海量曲库免登录，纯净开源',link:'https://app.bksy.top/yy.html'},
    {keywords:['域名','免费','DNS','domain'],title:'免费域名服务',desc:'获取专属网络地址，支持多种域名后缀',link:'https://cloud.bksy.top'},
    {keywords:['工具','开发','资源','共享'],title:'维物谷仓库',desc:'包含二维码生成、图片压缩、代码资源等实用工具',link:'https://api.bksy.top'},
    {keywords:['教程','API','技术','学习'],title:'技术教程',desc:'API实现、前端开发、云服务等实战指南',link:'xm.html'},
    {keywords:['活动','参与','事件','activity'],title:'精彩活动',desc:'交换友链、反馈Bug、游戏交流等活动',link:'hd.html'},
    {keywords:['友链','链接','交换','friends'],title:'友情链接',desc:'与其他优质网站交换友情链接',link:'yl.html'},
    {keywords:['关于','介绍','作者','about'],title:'关于我们',desc:'了解部可思亿的项目理念和团队信息',link:'gy.html'},
    {keywords:['搜索','查找','search'],title:'站内搜索',desc:'搜索部可思亿站内所有功能与内容',link:'ss.html'},
    {keywords:['平台','网站','services'],title:'我们的平台',desc:'部可思亿的核心平台介绍',link:'xm.html'},
    {keywords:['项目','文章','技术'],title:'技术文章',desc:'精选热门技术文章与开发资源',link:'xm.html'},
    {keywords:['首页','主页','main'],title:'部可思亿首页',desc:'技术分享平台',link:'../index.html'},
    {keywords:['SSL','证书','安全','https'],title:'免费SSL证书',desc:'为网站启用HTTPS加密',link:'https://cloud.bksy.top'},
    {keywords:['托管','网站','部署','hosting'],title:'免费网站托管',desc:'零成本部署你的项目',link:'https://cloud.bksy.top'},
    {keywords:['源码','代码','开源','source'],title:'源码资源',desc:'开源项目与代码库',link:'https://api.bksy.top'},
    {keywords:['图床','图片','托管','image'],title:'共享图床',desc:'稳定免费的图片托管服务',link:'https://j47v.top/wwg/image.php'}
];
function searchSite(){
    var keyword=document.getElementById('searchInput').value.trim().toLowerCase();
    if(!keyword){
        document.getElementById('searchResults').innerHTML='<div class="no-results"><p>请输入搜索关键词</p></div>';
        return;
    }
    document.getElementById('searchResults').innerHTML='<div style="text-align:center;padding:20px"><p>搜索中: '+keyword+'</p></div>';
    setTimeout(function(){
        var results=[];
        siteData.forEach(function(item){
            var score=0;
            item.keywords.forEach(function(kw){
                if(keyword.includes(kw.toLowerCase())) score+=10;
                if(kw.toLowerCase().includes(keyword)) score+=5;
            });
            if(item.title.toLowerCase().includes(keyword)) score+=20;
            if(score>0) results.push({...item,score:score});
        });
        results.sort(function(a,b){return b.score-a.score;});
        if(results.length===0){
            document.getElementById('searchResults').innerHTML='<div class="no-results"><i class="fas fa-search" style="font-size:3rem;margin-bottom:15px;color:#ddd"></i><p>未找到相关内容</p></div>';
            return;
        }
        var html='<div style="margin-bottom:15px;color:#666">找到 '+results.length+' 条结果</div>';
        results.forEach(function(item){
            html+='<div class="result-item"><div class="result-title">'+item.title+'</div><div class="result-desc">'+item.desc+'</div><a href="'+item.link+'" class="result-link" target="_blank"><i class="fas fa-external-link-alt"></i> 访问</a></div>';
        });
        document.getElementById('searchResults').innerHTML=html;
    },800);
}
function searchKeyword(keyword){
    document.getElementById('searchInput').value=keyword;
    searchSite();
}
document.addEventListener('DOMContentLoaded',function(){
    var loader=document.querySelector('.loader');
    if(loader){
        setTimeout(function(){
            loader.classList.add('hidden');
            setTimeout(function(){
                loader.style.display='none';
            },500);
        },1500);
    }
    var savedTheme=localStorage.getItem('theme');
    if(savedTheme==='dark') document.body.classList.add('dark');
    if(savedTheme==='cream') document.body.classList.add('cream');
});
</script>
